<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#6a4320">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Osada</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b1a0b;--paper:#f6ecd2;--paper2:#ead9b0;--card:#fff8e6;--wood:#7a4f2a;--wood-d:#4a2f17;--gold:#ffc83d;--gold-d:#c98a00;--green:#5fbf3a;--green-d:#3a8a1f;--red:#e0483a;--red-d:#9d2a1f;--blue:#3d8fd6;--navh:74px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;margin:0}
html,body{height:100%;overflow:hidden;background:#8fd0f0;overscroll-behavior:none;touch-action:none}
body{font-family:Nunito,system-ui,sans-serif;font-weight:800;color:var(--ink)}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ol{color:#fff;text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),1.5px 1.5px 0 var(--ink),-1.5px 1.5px 0 var(--ink),1.5px -1.5px 0 var(--ink),-1.5px -1.5px 0 var(--ink)}
#labels{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.lab{position:absolute;left:0;top:0;will-change:transform;pointer-events:none}
.bub{pointer-events:auto;width:48px;height:48px;border-radius:50% 50% 50% 8px;transform:rotate(-45deg);background:#fff;border:3px solid var(--ink);display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.25);animation:bob 1.1s ease-in-out infinite;cursor:pointer}
.bub span{transform:rotate(45deg);font-size:23px}
.bub.full{background:#ffe08a}
@keyframes bob{50%{translate:0 -6px}}
.tmr{background:rgba(30,20,10,.85);border-radius:12px;padding:4px 9px 6px;color:#fff;font:800 15px "Baloo 2";text-align:center;min-width:76px;white-space:nowrap}
.tmr i{display:block;height:6px;border-radius:3px;background:#3b2a18;margin-top:3px;overflow:hidden}
.tmr i b{display:block;height:100%;background:linear-gradient(#9be86a,#4fae2a)}
.chip{background:rgba(30,20,10,.8);border:2px solid rgba(255,255,255,.35);border-radius:10px;padding:2px 8px;color:#fff;font:800 13px "Baloo 2";white-space:nowrap}

/* HUD */
.hud{position:fixed;z-index:10;pointer-events:none}
.tl{left:8px;top:calc(env(safe-area-inset-top) + 8px);display:flex;flex-direction:column;gap:6px;width:min(54vw,230px)}
.tr{right:8px;top:calc(env(safe-area-inset-top) + 8px);display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.player{display:flex;align-items:center;gap:7px;pointer-events:auto}
.star{width:44px;height:44px;flex:0 0 44px;background:radial-gradient(circle at 35% 30%,#7cc7ff,#2f7fd0);border:3px solid var(--ink);border-radius:13px;display:grid;place-items:center;font:800 21px "Baloo 2";box-shadow:0 3px 0 rgba(0,0,0,.3)}
.pname{font:800 15px "Baloo 2";white-space:nowrap}
.xpb{width:104px;height:9px;border-radius:5px;background:rgba(0,0,0,.5);border:2px solid var(--ink);overflow:hidden;margin-top:2px}
.xpb i{display:block;height:100%;background:linear-gradient(#a6e3ff,#3d9be0);width:100%;transform-origin:left;transform:scaleX(0);transition:transform .4s}
.rbar{position:relative;width:128px;height:27px;border-radius:14px;background:rgba(20,12,4,.65);border:2px solid var(--ink);margin-right:12px}
.rbar .f{position:absolute;left:2px;top:2px;bottom:2px;border-radius:11px;width:calc(100% - 4px);transform-origin:left;transform:scaleX(0);transition:transform .35s}
.rbar .v{position:absolute;right:22px;top:2px;font:800 16px "Baloo 2"}
.rbar .m{position:absolute;left:8px;top:6px;font:800 10px "Baloo 2";color:rgba(255,255,255,.8)}
.rbar .i{position:absolute;right:-16px;top:-6px;font-size:28px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.4))}
.rbar.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.08)}}
.pill{display:inline-flex;align-items:center;gap:5px;background:rgba(20,12,4,.65);border:2px solid var(--ink);border-radius:12px;padding:3px 10px;font:800 14px "Baloo 2";pointer-events:auto;width:max-content}
.threat{pointer-events:auto;cursor:pointer;border:3px solid var(--ink);border-radius:14px;padding:6px 9px;box-shadow:0 3px 0 rgba(0,0,0,.3);background:linear-gradient(#5a7a3a,#3e5a26);color:#fff;font:800 13px "Baloo 2";line-height:1.25}
.threat .tt{display:flex;align-items:center;gap:6px;font-size:14px}
.threat .ts{font-size:12px;opacity:.92;margin-top:2px}
.threat.warn{background:linear-gradient(#c79a2a,#9a6f12)}
.threat.danger{background:linear-gradient(#d0493a,#9a2a1f)}
.threat.hot{animation:hot .7s ease-in-out infinite}
@keyframes hot{50%{box-shadow:0 3px 0 rgba(0,0,0,.3),0 0 0 4px #ffcf3a}}
.threat .mr{margin-top:4px;padding-top:4px;border-top:1px dashed rgba(255,255,255,.45);font-size:12px}
.quest{pointer-events:auto;cursor:pointer;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:6px 9px 7px;box-shadow:0 3px 0 rgba(0,0,0,.3);font-size:12.5px;line-height:1.25}
.quest .qt{font:800 12px "Baloo 2";color:var(--wood);display:flex;justify-content:space-between;gap:4px}
.quest .qx{font-weight:900}
.qbar{height:8px;border-radius:4px;background:#e2d2a8;margin-top:5px;overflow:hidden;border:1px solid rgba(0,0,0,.2)}
.qbar i{display:block;height:100%;background:linear-gradient(#9be86a,#4fae2a)}
.quest .qr{font-size:11.5px;color:#6a5434;margin-top:4px}
.quest .btn{margin-top:6px;padding:6px 10px;font-size:14px;width:100%}
.quest.done{animation:glow 1s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 3px 0 rgba(0,0,0,.3),0 0 0 4px var(--gold)}}

/* top bar */
.topbar{position:fixed;left:0;right:0;top:0;z-index:10;display:flex;gap:4px;align-items:center;padding:calc(env(safe-area-inset-top) + 5px) 5px 5px;background:linear-gradient(rgba(40,24,10,.82),rgba(40,24,10,.6));border-bottom:2px solid rgba(0,0,0,.35)}
.tlv .pti{font-size:17px;line-height:1;position:relative;z-index:1;margin-right:1px}
.tlv{display:flex!important;align-items:center;justify-content:center;gap:1px;flex:0 0 58px!important;}
.tlv b{font-size:14px!important}
.tlv em{position:absolute;top:1px;right:2px;font-style:normal;font-size:11px;z-index:2}
.tlv.sp{animation:hlp 1s ease-in-out infinite}
.tlv{flex:0 0 34px;height:34px;border-radius:10px;border:2px solid var(--ink);background:radial-gradient(circle at 35% 30%,#7cc7ff,#2f7fd0);display:grid;place-items:center;position:relative;overflow:hidden;cursor:pointer}
.tlv b{font:800 17px "Baloo 2";position:relative;z-index:1}
.tlv i{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.45)}
.tlv u{display:block;height:100%;background:#9fe36a;transform-origin:left;transform:scaleX(0);transition:transform .4s}
.bars{flex:1;display:flex;gap:4px;min-width:0}
.res{flex:1;min-width:0;position:relative;height:34px;border-radius:10px;background:rgba(0,0,0,.42);border:2px solid rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;gap:2px;overflow:hidden;cursor:pointer}
.res .i{font-size:16px;line-height:1;filter:drop-shadow(0 1px 0 rgba(0,0,0,.4))}
.res .v{font:800 13.5px "Baloo 2";color:#fff;white-space:nowrap}
.res .c{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(0,0,0,.4)}
.res .c b{display:block;height:100%;transform-origin:left;transform:scaleX(0);transition:transform .35s}
.res.full .v{color:#ffcf5a}.res.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.1)}}
.qdone{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 50px);transform:translate(-50%,-140%);opacity:0;z-index:13;width:min(92vw,380px);background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 rgba(0,0,0,.35);padding:8px 10px;display:flex;align-items:center;gap:9px;transition:transform .3s cubic-bezier(.2,1.3,.4,1),opacity .2s;pointer-events:none}
.qdone.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.qdone .ic{font-size:30px}.qdone .tx{flex:1;min-width:0;font-size:12.5px;line-height:1.25}.qdone .tx b{display:block;font:800 14px "Baloo 2";color:var(--green-d)}
.hl{animation:hlp 1s ease-in-out infinite!important;position:relative;z-index:2}
@keyframes hlp{50%{box-shadow:0 0 0 4px #fff,0 0 0 8px #ffc83d}}
.act.hl .o{animation:hlp 1s ease-in-out infinite}
.arrow{font-size:38px;animation:arr .7s ease-in-out infinite;filter:drop-shadow(0 3px 0 rgba(0,0,0,.4))}
@keyframes arr{50%{translate:0 -12px}}
.panel.tall{height:min(86dvh,760px)}
.visitbar{position:fixed;left:0;right:0;top:0;z-index:12;display:none;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;background:linear-gradient(#3d2a6b,#2a1d4d);border-bottom:3px solid var(--ink)}
.visitbar b{display:block;font:800 17px "Baloo 2"}.visitbar small{color:#d9ccff;font-size:12px}.visitbar>div{flex:1;min-width:0}
body.visit .visitbar{display:flex}body.visit .topbar,body.visit .nav,body.visit .qdone,body.visit .sel{display:none!important}
/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:12;display:flex;gap:4px;padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);background:linear-gradient(#8f5f33,#6a4320);border-top:3px solid var(--ink);box-shadow:0 -4px 12px rgba(0,0,0,.2)}
.nb{flex:1;position:relative;border:3px solid var(--ink);border-radius:14px;background:linear-gradient(#fff3d1,#e7cf96);box-shadow:0 3px 0 rgba(0,0,0,.35);padding:4px 0 3px;display:flex;flex-direction:column;align-items:center;cursor:pointer;font:800 11.5px "Baloo 2";color:var(--ink);min-width:0}
.nb .e{font-size:24px;line-height:1.1}
.nb:active{transform:translateY(3px);box-shadow:0 0 0 rgba(0,0,0,.35)}
.nb.main{background:linear-gradient(#ffe07a,#f2a91c)}
.nb .dot{position:absolute;top:-8px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--red);border:2px solid #fff;font:800 12px "Baloo 2";color:#fff;display:none;place-items:center;padding:0 4px}
.nb .dot.on{display:grid}
.nb.pulse{animation:npulse 1.1s ease-in-out infinite}
@keyframes npulse{50%{box-shadow:0 3px 0 rgba(0,0,0,.35),0 0 0 4px #fff,0 0 0 7px var(--gold)}}

/* selection panel */
.sel{position:fixed;left:50%;bottom:calc(var(--navh) + env(safe-area-inset-bottom) + 10px);transform:translate(-50%,30px);opacity:0;pointer-events:none;transition:transform .22s cubic-bezier(.2,1.3,.4,1),opacity .15s;z-index:11;display:flex;flex-direction:column;align-items:center;gap:6px;width:max-content;max-width:100vw;padding:0 8px}
.sel.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.sel .nm{font:800 21px "Baloo 2";text-align:center}
.sel .inf{font:800 13px "Baloo 2";color:#fff;background:rgba(20,12,4,.72);border-radius:10px;padding:3px 10px;text-align:center;max-width:94vw}
.acts{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.act{width:66px;display:flex;flex-direction:column;align-items:center;cursor:pointer;border:0;background:none;font:inherit;padding:0}
.act .o{width:58px;height:58px;border-radius:50%;border:3px solid var(--ink);background:radial-gradient(circle at 40% 30%,#fff7df,#e8d3a1);display:grid;place-items:center;font-size:26px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.act.g .o{background:radial-gradient(circle at 40% 30%,#c9f7a8,#5fbf3a)}
.act.y .o{background:radial-gradient(circle at 40% 30%,#fff1a8,#f2b81f)}
.act.p .o{background:radial-gradient(circle at 40% 30%,#f2c9ff,#a457d6)}
.act.r .o{background:radial-gradient(circle at 40% 30%,#ffc3b8,#d8392b)}
.act:active .o{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.act span{font:800 12px "Baloo 2";margin-top:3px;text-align:center;line-height:1.1}
.act em{font-style:normal;font:800 11px "Baloo 2";background:rgba(20,12,4,.75);color:#fff;border-radius:7px;padding:1px 5px;margin-top:2px;white-space:nowrap}
.act.off{opacity:.55}

/* placement */
.plc{position:fixed;left:0;top:0;z-index:9;display:none;gap:14px}
.plc.on{display:flex}
.plc button{width:54px;height:54px;border-radius:50%;border:3px solid var(--ink);font-size:24px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.plc .ok{background:radial-gradient(circle at 40% 30%,#c9f7a8,#4fae2a)}
.plc .no{background:radial-gradient(circle at 40% 30%,#ffb3a8,#d8392b)}
.plc .ok:disabled{filter:grayscale(1);opacity:.6}
.plhint{position:fixed;left:50%;bottom:calc(var(--navh) + env(safe-area-inset-bottom) + 12px);transform:translateX(-50%);z-index:11;display:none;background:rgba(20,12,4,.85);color:#fff;border:2px solid rgba(255,255,255,.3);border-radius:14px;padding:8px 14px;font:800 14px "Baloo 2";text-align:center;max-width:92vw}
.plhint.on{display:block}
.plhint b{color:#9be86a}.plhint s{color:#ff8a7a;text-decoration:none}

/* panels */
.scrim{position:fixed;inset:0;background:rgba(10,8,4,.55);z-index:30;display:none}
.scrim.on{display:block}
.panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.92);opacity:0;pointer-events:none;z-index:31;width:min(95vw,540px);max-height:86dvh;background:var(--paper);border:4px solid var(--ink);border-radius:22px;box-shadow:0 8px 0 rgba(0,0,0,.35);display:flex;flex-direction:column;transition:.2s cubic-bezier(.2,1.3,.4,1)}
.panel.on{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
.ph{background:linear-gradient(#9a6a3c,#7a4f2a);border-bottom:4px solid var(--ink);border-radius:17px 17px 0 0;padding:9px 10px 9px 16px;display:flex;align-items:center;justify-content:space-between}
.ph h2{font:800 25px "Baloo 2"}
.xbtn{width:40px;height:40px;border-radius:12px;border:3px solid var(--ink);background:linear-gradient(#ff8a7a,#d8392b);color:#fff;font:800 20px "Baloo 2";cursor:pointer;box-shadow:0 3px 0 var(--red-d)}
.tabs{display:flex;gap:5px;padding:9px 10px 0;overflow-x:auto;scrollbar-width:none;flex:0 0 auto}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:3px solid var(--ink);border-radius:12px 12px 0 0;border-bottom:0;padding:7px 11px;background:var(--paper2);font:800 14.5px "Baloo 2";cursor:pointer;color:var(--ink)}
.tabs button.on{background:var(--card)}
.tabs:empty{display:none}
.pb{overflow-y:auto;padding:12px;flex:1;-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.card{background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:6px 5px 8px;text-align:center;cursor:pointer;position:relative;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.card:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.card img{width:100%;aspect-ratio:1;display:block;border-radius:10px;background:radial-gradient(circle at 50% 60%,#cfeaa8,#9fcf6e)}
.card .n{font:800 13.5px "Baloo 2";line-height:1.1;margin-top:4px;min-height:30px;display:flex;align-items:center;justify-content:center}
.card .k{font-size:11px;color:#6a5434}
.card .cst{font:800 13px "Baloo 2";margin-top:3px;display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.card.lock{opacity:.62}.card.lock img{filter:grayscale(1) brightness(.85)}
.card .lk{position:absolute;inset:0;display:grid;place-items:center;font:800 13px "Baloo 2";color:#fff;text-shadow:0 2px 0 #000;padding:10px;background:rgba(0,0,0,.28);border-radius:13px}
.no{color:var(--red)}
.btn{border:3px solid var(--ink);border-radius:14px;padding:10px 16px;font:800 17px "Baloo 2";cursor:pointer;color:#fff;background:linear-gradient(#7fdc55,#3fa024);box-shadow:0 4px 0 var(--green-d);text-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-d)}
.btn.y{background:linear-gradient(#ffe07a,#f2a91c);box-shadow:0 4px 0 var(--gold-d);color:var(--ink);text-shadow:none}
.btn.p{background:linear-gradient(#d79bff,#9446cc);box-shadow:0 4px 0 #642a8f}
.btn.r{background:linear-gradient(#ff8a7a,#d8392b);box-shadow:0 4px 0 var(--red-d)}
.btn.s{padding:6px 10px;font-size:14px;border-radius:11px}
.btn:disabled{filter:grayscale(1);opacity:.55}
.row{display:flex;gap:9px;align-items:center}
.li{background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:9px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.li .ic{width:50px;height:50px;flex:0 0 50px;border-radius:12px;background:var(--paper2);display:grid;place-items:center;font-size:28px;border:2px solid rgba(0,0,0,.15);position:relative}
.li .ic small{position:absolute;bottom:-6px;right:-6px;background:var(--ink);color:#fff;border-radius:8px;padding:0 5px;font:800 12px "Baloo 2"}
.li .tx{flex:1;min-width:0;font-size:12.5px;color:#5a4428;line-height:1.3}
.li .tx b{font:800 16px "Baloo 2";color:var(--ink);display:block}
.li.lock{opacity:.5}.li.cur{border-color:#c98a00;box-shadow:0 0 0 3px var(--gold)}
.li .btns{display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;border-radius:7px;padding:0 6px;font:800 11px "Baloo 2";color:#fff;margin-right:3px}
.tag.inf{background:#9a5a2a}.tag.rng{background:#3f8a3a}.tag.cav{background:#2f6fb5}
.stat{display:flex;justify-content:space-between;gap:8px;background:var(--card);border:2px solid rgba(0,0,0,.15);border-radius:10px;padding:7px 10px;margin-bottom:6px;font-size:13.5px}
.stat b{font:800 15px "Baloo 2";white-space:nowrap}
.stat .up{color:var(--green-d)}
.mixbar{display:flex;height:16px;border-radius:8px;overflow:hidden;border:2px solid var(--ink);margin:4px 0 8px}
.mixbar i{display:block;height:100%}
.mixbar .inf{background:#c27a3a}.mixbar .rng{background:#5aa64a}.mixbar .cav{background:#4a86d0}
.verdict{border-radius:12px;padding:9px 12px;text-align:center;font:800 17px "Baloo 2";color:#fff;border:3px solid var(--ink);margin:8px 0}
.verdict.good{background:linear-gradient(#7fdc55,#3fa024)}.verdict.mid{background:linear-gradient(#ffd34d,#d9a01a);color:var(--ink)}.verdict.bad{background:linear-gradient(#ff8a7a,#d8392b)}
.dlg-c{text-align:center}
.dlg-c img{width:140px;height:140px;border-radius:20px;background:radial-gradient(circle at 50% 60%,#cfeaa8,#9fcf6e);border:3px solid var(--ink);margin:0 auto 10px;display:block}
.cost{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;font:800 17px "Baloo 2";margin:10px 0}
.cost span{background:var(--card);border:2px solid rgba(0,0,0,.15);border-radius:10px;padding:3px 9px}
.trade{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.trade button{font:800 13px "Baloo 2";padding:9px 4px;border:3px solid var(--ink);border-radius:12px;background:var(--card);cursor:pointer}
.step{display:flex;align-items:center;gap:5px}
.step button{width:34px;height:34px;border-radius:10px;border:3px solid var(--ink);background:var(--paper2);font:800 18px "Baloo 2";cursor:pointer}
.step b{min-width:34px;text-align:center;font:800 17px "Baloo 2"}
.menu .li{cursor:pointer}
h4{font:800 16.5px "Baloo 2";margin:10px 0 7px}
h4:first-child{margin-top:0}
.chap{font:800 15px "Baloo 2";color:var(--wood);margin:12px 2px 6px;display:flex;justify-content:space-between}
.chap:first-child{margin-top:0}
p.note{font-size:12.5px;color:#6a5434;margin:6px 2px}
textarea,input{user-select:text;-webkit-user-select:text}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px}
.sw button{width:38px;height:38px;border-radius:50%;border:3px solid var(--ink);cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.sw button.on{outline:3px solid #ffc83d;outline-offset:2px}

function addObstacles(s,pin,pout,ringOnly){const r=rng(1337+s.nid*7),occ=new Set();
  s.b.forEach(b=>{const k=DEF[b.t].s;for(let x=0;x<k;x++)for(let y=0;y<k;y++)occ.add((b.i+x)+','+(b.j+y))});s.obs.forEach(o=>occ.add(o.i+','+o.j));
  for(let i=0;i<G;i++)for(let j=0;j<G;j++){if(occ.has(i+','+j))continue;
    if(ringOnly&&!(i<3||j<3||i>=G-3||j>=G-3))continue;
    const inner=i>=10&&i<20&&j>=10&&j<20,core=i>=12&&i<18&&j>=12&&j<18;if(core)continue;
    if(r()<(inner?pin:pout)){const q=r();s.obs.push({id:s.nid++,t:q<.42?'pine':q<.7?'oak':q<.88?'rock':'bush',i,j})}}}

    f.position.set(c[0]-H+.5,0,c[1]-H+.5);scene.add(f);people.villagers.push({f,path:[],wait:Math.random()*3})}

function bfs(si,sj,ti,tj){if(OCC[ti][tj]||!unl(ti,tj))return null;const N=G*G,prev=new Int16Array(N).fill(-1),s=si*G+sj,t=ti*G+tj;prev[s]=s;const q=[s];let h=0;
  while(h<q.length){const c=q[h++];if(c===t)break;const ci=c/G|0,cj=c%G;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const ni=ci+dx,nj=cj+dy;if(ni<0||nj<0||ni>=G||nj>=G)continue;const n=ni*G+nj;if(prev[n]!==-1||OCC[ni][nj]||!unl(ni,nj))continue;prev[n]=c;q.push(n)}}
  if(prev[t]===-1)return null;const p=[];let c=t;while(c!==s){p.push(c);c=prev[c]}return p.reverse()}

function updCam(){const c=Math.cos(cam.pitch);camera.position.set(cam.t.x+Math.sin(cam.yaw)*c*cam.d,Math.sin(cam.pitch)*cam.d,cam.t.z+Math.cos(cam.yaw)*c*cam.d);camera.lookAt(cam.t)}

const ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),ground=new THREE.Plane(new V3(0,1,0),0);

const ptrs=new Map();let gest=null;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});audioInit();intro=null;camFly=null;
  if(ptrs.size===1){gest={x:e.clientX,y:e.clientY,moved:false,ghost:false,p0:groundAt(e.clientX,e.clientY)};
    if(PL){setRay(e.clientX,e.clientY);const s=DEF[PL.t].s,p=gest.p0;const inF=p&&p.x>=PL.i-H&&p.x<=PL.i-H+s&&p.z>=PL.j-H&&p.z<=PL.j-H+s;if(inF||ray.intersectObject(PL.g,true).length){gest.ghost=true;gest.gOff=p?[p.x-(PL.i-H+s/2),p.z-(PL.j-H+s/2)]:[0,0]}}}
  if(ptrs.size===2){const[a,b]=[...ptrs.values()];gest={pinch:1,d:Math.hypot(a.x-b.x,a.y-b.y),a:Math.atan2(b.y-a.y,b.x-a.x),cd:cam.d,cy:cam.yaw,moved:true}}});

  if(gest.pinch&&ptrs.size===2){const[a,b]=[...ptrs.values()];cam.d=clamp(gest.cd*gest.d/Math.hypot(a.x-b.x,a.y-b.y),9,44);cam.yaw=gest.cy+(Math.atan2(b.y-a.y,b.x-a.x)-gest.a);updCam();return}
  if(Math.hypot(e.clientX-gest.x,e.clientY-gest.y)>7)gest.moved=true;if(!gest.moved)return;
  if(gest.ghost){const p=groundAt(e.clientX,e.clientY);if(p)moveGhost(p.x-gest.gOff[0],p.z-gest.gOff[1]);return}
  const p1=groundAt(e.clientX,e.clientY);if(p1&&gest.p0){cam.t.add(gest.p0.clone().sub(p1));cam.t.x=clamp(cam.t.x,-18,18);cam.t.z=clamp(cam.t.z,-18,18);updCam()}});
const pend=e=>{if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);if(gest&&!gest.moved&&ptrs.size===0)tap(e.clientX,e.clientY);if(ptrs.size===0)gest=null;else if(gest&&gest.pinch)gest=null};

function tap(x,y){if(window.__visit){const r=pick(x,y);if(r&&r.k==='b'){const b=S.b.find(q=>q.id===r.id);if(b)toast(`${b.t==='hall'?hallName(b.l):DEF[b.t].n} · poz. ${b.l}`)}return}
  if(PL){const p=groundAt(x,y);if(p)moveGhost(p.x,p.z);return}
  let r=pick(x,y);if(!r){const p=groundAt(x,y);if(p){const i=Math.floor(p.x+H),j=Math.floor(p.z+H),o=S.obs.find(o=>o.i===i&&o.j===j);if(o)r={k:'o',id:o.id}}}
  if(!r){deselect();return}
  if(r.k==='hero'){deselect();sfx('tap');openHero();return}
  if(r.k==='b'){const b=S.b.find(q=>q.id===r.id);if(b&&DEF[b.t].prod&&!b.job&&readyB(b)){collect(b,x,y);if(SEL&&SEL.id===b.id)return}}
  select(r)}

  let h=`<div class="stat"><span>${T.e} ${T.d}</span><b>poz. ${p.lvl}</b></div><p class="note">Poszukiwacze nie walczą jak armia — liczy się ogólna siła oddziału. Za słaby oddział wpadnie w zasadzkę.</p>`;

  h+=`<div class="verdict ${v[0]}">${v[1]}</div><div class="stat"><span>Siła oddziału vs niebezpieczeństwo</span><b>${pe} vs ${D}</b></div><div class="stat"><span>Czas wyprawy</span><b>${ft(travel(p,ATK)+T.t)}</b></div><button class="btn" style="width:100%" id="eGo" ${nUnits(ATK)?'':'disabled'}>🧭 Wyruszajcie!</button>`;

    $('#eGo').onclick=()=>{const U={};for(const u in ATK)if(ATK[u])U[u]=ATK[u];sendExplore(pid,U)}})}
function openAttack(sid){ATK={};for(const u in UNITS)ATK[u]=S.army[u]||0;openPanel('Atak: '+site(sid).name,'atk',()=>renderAttack(sid))}
function renderAttack(sid){const s=site(sid),{pe,ee}=attackBattle(ATK,s.E),k=pe/Math.max(1,ee),v=!nUnits(ATK)?['bad','Wybierz jednostki']:k>=1.3?['good','Pewne zwycięstwo']:k>=1?['mid','Wyrównana walka — ryzykownie']:['bad','Przegrana — za słaba armia'];
  let h=`<div class="stat"><span>Obrona: ${mixTxt(s.E)}</span><b>${s.name}</b></div>${mixBar(s.E)}<p class="note">${counterTip(s.E)}</p>`;
  h+=Object.entries(UNITS).filter(([u])=>(S.army[u]||0)>0).map(([u,X])=>`<div class="li"><div class="ic">${X.e}</div><div class="tx"><b>${X.n}</b><span class="tag ${X.cls}">${CLS[X.cls].n}</span>siła ${X.pow} · w wiosce ${S.army[u]}</div>
    <div class="step"><button data-u="${u}" data-d="-1">−</button><b>${ATK[u]}</b><button data-u="${u}" data-d="1">+</button><button data-u="${u}" data-d="all" style="width:auto;padding:0 6px;font-size:12px">MAX</button></div></div>`).join('')||'<p class="note">Nie masz wojska w wiosce. Wyszkol jednostki w Koszarach.</p>';

  setPB(h,pb=>{pb.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{const u=b.dataset.u,d=b.dataset.d;ATK[u]=d==='all'?S.army[u]:clamp(ATK[u]+(+d),0,S.army[u]);sfx('tick');renderAttack(sid)});

function startPlace(t,id){deselect();closePanel();if(PL)endPlace(true);
  if(!id){if(cntAll(t)>=allowed(t)){toast('Limit osiągnięty — ulepsz '+hallName(hallL()));sfx('err');return}
    if(!canPay(newCost(t))){toast('Brakuje surowców');sfx('err');return}
    if(DEF[t].t0&&freeB()<1){toast('👷 Wszyscy budowniczowie są zajęci');sfx('err');return}}
  const b=id&&S.b.find(q=>q.id===id),g=makeMesh(t,b?b.l:1);scene.add(g);
  PL={t,id,g,i:0,j:0};if(b){PL.i=b.i;PL.j=b.j}else{const sp=findSpot(t);PL.i=sp[0];PL.j=sp[1]}
  cells.visible=true;sync();posGhost();$('#plc').classList.add('on');$('#plhint').classList.add('on');sfx('tap')}
function findSpot(t){const s=DEF[t].s,c=[Math.round(cam.t.x+H-s/2),Math.round(cam.t.z+H-s/2)];
  for(let r=0;r<G;r++)for(let i=c[0]-r;i<=c[0]+r;i++)for(let j=c[1]-r;j<=c[1]+r;j++)if(canPlace(t,i,j))return[i,j];return c}
function moveGhost(x,z){const s=DEF[PL.t].s,i=clamp(Math.round(x+H-s/2),0,G-s),j=clamp(Math.round(z+H-s/2),0,G-s);if(i!==PL.i||j!==PL.j){PL.i=i;PL.j=j;posGhost();sfx('tick')}}
function posGhost(){const s=DEF[PL.t].s,x=PL.i-H+s/2,z=PL.j-H+s/2;PL.ok=canPlace(PL.t,PL.i,PL.j,PL.id);PL.g.position.set(x,.15,z);$('#plOk').disabled=!PL.ok;paintCells();
  const d=DEF[PL.t];$('#plhint').innerHTML=`${PL.id?'Przenoszenie':'Budowa'}: <b>${d.n}</b> (${s}×${s})<br>${PL.ok?'<b>✔ Wolne miejsce</b> — przeciągnij lub dotknij kratki':'<s>✖ Zajęte</s> — czerwone kratki są zajęte'}${PL.id?'':' · '+costTxt(newCost(PL.t))}`}
function endPlace(silent){if(!PL)return;scene.remove(PL.g);PL=null;cells.visible=false;$('#plc').classList.remove('on');$('#plhint').classList.remove('on');sync()}
$('#plNo').onclick=()=>{endPlace();sfx('tap')};
$('#plOk').onclick=()=>{if(!PL||!PL.ok)return;const{t,id,i,j}=PL;
  if(id){const b=S.b.find(q=>q.id===id);b.i=i;b.j=j;endPlace();recs[id].pop=performance.now();sfx('place');dirty=true;return}
  const c=newCost(t);if(!canPay(c)){toast('Brakuje surowców');return endPlace()}
  pay(c);const d=DEF[t],b={id:S.nid++,t,i,j,l:d.t0?0:1,t0:Date.now()};if(d.t0)b.job={kind:'build',start:Date.now(),end:Date.now()+d.t0*1000*buildMul()};
  S.b.push(b);endPlace();burst(bPos(b));sfx('place');if(!d.t0)setTimeout(()=>sfx('coin'),120);addXP(2);dirty=true;if(!d.t0)recs[b.id].pop=performance.now();
  if((t==='wall'||d.cat==='dec')&&cntAll(t)<allowed(t)&&canPay(newCost(t))){startPlace(t);for(const[a,q]of[[1,0],[0,1],[-1,0],[0,-1]])if(canPlace(t,i+a,j+q)){PL.i=i+a;PL.j=j+q;posGhost();break}}};

let PANEL=null;
function openPanel(title,kind,render){PANEL={kind,render};$('#panel').classList.toggle('tall',['build','army','goals','hero'].includes(kind));$('#pB').dataset.h='';$('#pT').textContent=title;$('#panel').classList.add('on');$('#scrim').classList.add('on');$('#pTabs').innerHTML='';render();sfx('tap')}
function closePanel(){PANEL=null;$('#panel').classList.remove('on');$('#scrim').classList.remove('on')}
$('#pX').onclick=closePanel;$('#scrim').onclick=closePanel;
function dialog(title,html,btns=[]){openPanel(title,'dlg',()=>{$('#pB').innerHTML=html+(btns.length?`<div class="row" style="margin-top:12px">${btns.map((b,i)=>`<button class="btn ${b[2]||''}" style="flex:1" data-i="${i}" ${b[3]?'disabled':''}>${b[0]}</button>`).join('')}</div>`:'');
  $('#pB').querySelectorAll('[data-i]').forEach(el=>el.onclick=()=>btns[el.dataset.i][1]())})}
function setPB(h,bind){const pb=$('#pB');if(pb.dataset.h===h)return;const st=pb.scrollTop;pb.dataset.h=h;pb.innerHTML=h;pb.scrollTop=st;bind&&bind(pb);tickTimers()}
function tabs(list,cur,fn){const sig=list.map(x=>x[0]).join()+cur;if($('#pTabs').dataset.sig===sig&&$('#pTabs').children.length)return;$('#pTabs').dataset.sig=sig;$('#pTabs').innerHTML=list.map(([k,n])=>`<button class="${k===cur?'on':''}" data-t="${k}">${n}</button>`).join('');$('#pTabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{sfx('tap');fn(b.dataset.t)})}
function tickTimers(){const now=Date.now();document.querySelectorAll('[data-end]').forEach(el=>el.textContent=ft((+el.dataset.end-now)/1000))}
const thumbs={};let thR;
function thumb(t,l=1){const k=t+l+era();if(thumbs[k])return thumbs[k];
  if(!thR){thR=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});thR.setSize(180,180);thR.outputEncoding=THREE.sRGBEncoding;thR.toneMapping=THREE.ACESFilmicToneMapping}
  const sc=new THREE.Scene();sc.add(new THREE.HemisphereLight(0xffffff,0x667744,.9));const dl=new THREE.DirectionalLight(0xfff0d8,1.1);dl.position.set(3,5,4);sc.add(dl);
  const m=makeMesh(t,l);sc.add(m);const A=ANIM[t];if(A)for(let i=0;i<A.n(l);i++){const a=A.mk();let x,z;do{x=(Math.random()*2-1)*A.r;z=(Math.random()*2-1)*A.r}while(!A.ok(x,z));a.position.set(x,.04,z);a.rotation.y=Math.random()*6;sc.add(a)}
  const s=DEF[t].s,cm=new THREE.PerspectiveCamera(30,1,.1,50),dd=s*1.25+.9;cm.position.set(dd*.75,dd*.75,dd*.75);cm.lookAt(0,s*.28+.12,0);thR.render(sc,cm);return thumbs[k]=thR.domElement.toDataURL()}
/* Budowanie */

  if(shopCat==='land'){const n=S.land+1,max=LANDMAX[hallL()-1];let h=`<div class="dlg-c"><div style="font-size:60px">🗺️</div><h4>Teren osady: ${side()}×${side()} pól</h4></div>`;

    else{const c=landCost(n),ns=Math.min(G,10+2*n);h+=stat('Wielkość terenu',`${side()}×${side()}`,`${ns}×${ns}`)+`<div class="stat"><span>Wolne miejsca do budowy</span><b>+${ns*ns-side()*side()} pól</b></div><div class="cost">${costHTML(c)}</div>`;

    pb=>pb.querySelectorAll('.card').forEach(el=>el.onclick=()=>{const t=el.dataset.t;if(allowed(t)===0){toast(`Odblokujesz: ${hallName(unlockAt(t))} poz. ${unlockAt(t)}`);sfx('err');return}startPlace(t)}))}
function upDialog(b){const d=DEF[b.t],c=upCost(b),t=upTime(b)*buildMul(),nl=b.l+1;let rows='';

  if(b.t==='vault')rows+=stat('Pojemność 🪙',fmt(1500*Math.pow(1.8,b.l-1)),fmt(1500*Math.pow(1.8,nl-1)));
  if(TRAINB.includes(b.t)){const per=b.t==='barracks'?10:5;rows+=stat('Miejsca w armii',armyCap(),armyCap()+per)+Object.values(UNITS).filter(x=>x.b===b.t&&x.bl===nl).map(x=>`<div class="stat"><span>Nowa jednostka</span><b class="up">${x.e} ${x.n}</b></div>`).join('')}
  if(b.t==='smithy')rows+=stat('Siła wojska',`+${b.l*6}%`,`+${nl*6}%`);
  if(b.t==='tower')rows+=stat('Siła w obronie',`+${b.l*5}`,`+${nl*5}`);
  if(b.t==='market')rows+=stat('Kurs wymiany',`${Math.round((.55+.07*b.l)*100)}%`,`${Math.round((.55+.07*nl)*100)}%`);
  if(b.t==='hall'){rows+=stat('Maks. teren',`${10+2*LANDMAX[b.l-1]}×${10+2*LANDMAX[b.l-1]}`,`${10+2*LANDMAX[nl-1]}×${10+2*LANDMAX[nl-1]}`)+stat('Maks. poziom budynków',b.l*2,nl*2);
    const nw=Object.entries(DEF).filter(([k,x])=>x.cnt&&x.cnt[nl-1]>x.cnt[b.l-1]).map(([k,x])=>`+${x.cnt[nl-1]-x.cnt[b.l-1]} ${x.n}`).concat(Object.entries(DEF).filter(([k,x])=>!x.cnt&&x.hall===nl).map(([k,x])=>x.n));

  dialog(`Ulepsz: ${b.t==='hall'?hallName(b.l):d.n}`,`<div class="dlg-c"><img src="${thumb(b.t,nl)}" alt=""><h4>Poziom ${b.l} → ${nl}${b.t==='hall'&&hallName(nl)!==hallName(b.l)?' · staje się: '+hallName(nl)+'!':''}</h4></div>${rows}<div class="cost">${costHTML(c)}<span>⏱ ${ft(t)}</span></div>${freeB()<1?'<p class="note" style="text-align:center;color:#9d2a1f">👷 Wszyscy budowniczowie są zajęci</p>':''}`,
    [['Ulepsz',()=>{if(startUpgrade(b))closePanel()},'y',!canPay(c)||freeB()<1]])}

function renderDaily(){const ts=dailyTasks(),now=new Date(),mid=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1).getTime();

function renderStory(){let h=`<div class="stat"><span>Ukończone zadania fabuły</span><b>${S.q} / ${QUESTS.length}</b></div>`,lastCh=-1;

  if(k==='raid'){if(!cnt('barracks'))return goTo(['build','barracks']);deselect();openArmy('def');return}
  if(k==='map'){openMap();MAP.spot=null;const now=Date.now(),c=S.world.sites.filter(s=>s.lvl>=a&&!(s.cool>now)).sort((x,y)=>x.lvl-y.lvl||Math.hypot(x.x-HOME.x,x.y-HOME.y)-Math.hypot(y.x-HOME.x,y.y-HOME.y))[0];
    if(c){MAP.sel=c.id;MAP.v.x=(c.x+HOME.x)/2;MAP.v.y=(c.y+HOME.y)/2;MAP.flash={id:c.id,until:now+6000};drawMapCard();hlSel('#mAtk')}}}

async function packSave(){save();const j=JSON.stringify(S);try{if(window.CompressionStream){const b=await new Response(new Blob([j]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer();let t='';new Uint8Array(b).forEach(x=>t+=String.fromCharCode(x));return 'OSADA1:'+btoa(t)}}catch(e){}return 'OSADA0:'+btoa(unescape(encodeURIComponent(j)))}
async function unpackSave(code){code=code.trim();if(code.startsWith('OSADA1:')){const bin=atob(code.slice(7)),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return JSON.parse(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text())}
  if(code.startsWith('OSADA0:'))return JSON.parse(decodeURIComponent(escape(atob(code.slice(7)))));throw new Error('zły kod')}

  dialog('Codzienna skrzynia',`<div class="dlg-c"><div style="font-size:70px">🎁</div><h4>Dzień ${k} z rzędu!</h4><div class="row" style="justify-content:center;gap:5px;margin:8px 0">${[1,2,3,4,5,6,7].map(d=>`<span style="width:34px;height:34px;border-radius:9px;display:grid;place-items:center;border:2px solid var(--ink);background:${d<=k?'#ffd866':'#eadfc4'};font:800 15px Baloo 2">${d}</span>`).join('')}</div><div class="cost">${costHTML(r).replace(/class="no"/g,'')}</div><p class="note" style="text-align:center">Wracaj codziennie — 7. dzień z rzędu daje 10 💎!</p></div>`,
  [['Odbierz',()=>{for(const[x,v]of Object.entries(r))gain(x,v);sfx('chest');closePanel();toast('🎁 Nagroda odebrana!')},'y']])}
if(!S.hero.made)setTimeout(()=>openCreator(true),700);
else if(away>2||notes.length)setTimeout(()=>dialog('Witaj z powrotem!',`<div class="dlg-c"><div style="font-size:60px">🌅</div><p>${away>2?`Nie było cię ${away>90?Math.round(away/60)+' godz':Math.round(away)+' min'}.`:''}</p></div>${notes.map(n=>`<div class="stat" style="display:block;text-align:left">${n}</div>`).join('')}<p class="note" style="text-align:center">Surowce czekają w dymkach nad budynkami — dotknij, by zebrać!</p>`,[[chest?'Dalej':'Do dzieła!',()=>{closePanel();if(chest)setTimeout(chestDialog,250)},'y']]),900);
else if(chest)setTimeout(chestDialog,900);
if(!S.hero.made&&chest)chest=0;
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
addEventListener('pagehide',save);addEventListener('beforeunload',save);document.addEventListener('freeze',save);
setInterval(save,3000);
setInterval(()=>netPush(),120000);setTimeout(()=>netPush(),8000);document.addEventListener('visibilitychange',()=>{if(document.hidden)netPush(true)});
{const w=new URLSearchParams(location.search).get('wies');if(w&&/^[0-9a-f-]{36}$/i.test(w)&&(!S.net||S.net.id!==w))setTimeout(()=>{if(S.hero.made)visitVillage(w);else toast('Najpierw stwórz bohatera — potem odwiedzisz wioskę znajomego')},1800)}
if(/FBAN|FBAV|FB_IAB|FBIOS|Instagram|Messenger|Line\/|TikTok|Snapchat|; wv\)/i.test(navigator.userAgent))setTimeout(()=>dialog('Otwórz w przeglądarce',`<div class="dlg-c"><div style="font-size:56px">⚠️</div><p>Grasz w okienku aplikacji (Messenger / Instagram / Facebook). Takie okienko <b>kasuje zapis gry</b> po zamknięciu.</p><p>Dotknij <b>⋯</b> lub <b>⋮</b> w rogu i wybierz <b>„Otwórz w przeglądarce”</b>.</p></div>`,[['Rozumiem',closePanel,'y']]),1600);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
