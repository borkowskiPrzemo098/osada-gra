<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#6fb7e0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Osada</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b1a0b;--paper:#f6ecd2;--paper2:#ead9b0;--wood:#7a4f2a;--wood-d:#4a2f17;--gold:#ffc83d;--gold-d:#c98a00;--green:#5fbf3a;--green-d:#3a8a1f;--red:#e0483a;--red-d:#9d2a1f;--blue:#3d8fd6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;margin:0}
html,body{height:100%;overflow:hidden;background:#8fd0f0;overscroll-behavior:none;touch-action:none}
body{font-family:Nunito,system-ui,sans-serif;font-weight:800;color:var(--ink)}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.L{font-family:"Lilita One",sans-serif;font-weight:400;letter-spacing:.3px}
.ol{color:#fff;text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),1.5px 1.5px 0 var(--ink),-1.5px 1.5px 0 var(--ink),1.5px -1.5px 0 var(--ink),-1.5px -1.5px 0 var(--ink)}
#labels{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.lab{position:absolute;left:0;top:0;transform:translate(-50%,-100%);will-change:transform;pointer-events:none}
.bub{pointer-events:auto;width:50px;height:50px;border-radius:50% 50% 50% 8px;transform:rotate(-45deg);background:#fff;border:3px solid var(--ink);display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.25);animation:bob 1.1s ease-in-out infinite;cursor:pointer}
.bub span{transform:rotate(45deg);font-size:24px}
.bub.full{background:#ffe08a}
@keyframes bob{50%{translate:0 -6px}}
.tmr{background:rgba(30,20,10,.82);border-radius:12px;padding:4px 9px 6px;color:#fff;font:400 15px "Lilita One";text-align:center;min-width:76px;white-space:nowrap}
.tmr i{display:block;height:6px;border-radius:3px;background:#3b2a18;margin-top:3px;overflow:hidden}
.tmr i b{display:block;height:100%;background:linear-gradient(#9be86a,#4fae2a)}
.chip{background:rgba(30,20,10,.75);border-radius:10px;padding:2px 8px;color:#fff;font:400 13px "Lilita One";white-space:nowrap}

/* HUD */
.hud{position:fixed;z-index:10;pointer-events:none}
.tl{left:10px;top:calc(env(safe-area-inset-top) + 10px);display:flex;flex-direction:column;gap:8px;max-width:52vw}
.tr{right:10px;top:calc(env(safe-area-inset-top) + 10px);display:flex;flex-direction:column;gap:7px;align-items:flex-end}
.player{display:flex;align-items:center;gap:8px;pointer-events:auto}
.star{width:46px;height:46px;flex:0 0 46px;background:radial-gradient(circle at 35% 30%,#7cc7ff,#2f7fd0);border:3px solid var(--ink);border-radius:14px;display:grid;place-items:center;font:400 22px "Lilita One";box-shadow:0 3px 0 rgba(0,0,0,.3)}
.pinfo{min-width:0}
.pname{font:400 16px "Lilita One";white-space:nowrap}
.xpb{width:110px;height:10px;border-radius:5px;background:rgba(0,0,0,.5);border:2px solid var(--ink);overflow:hidden;margin-top:2px}
.xpb i{display:block;height:100%;background:linear-gradient(#a6e3ff,#3d9be0);width:0;transition:width .4s}
.rbar{position:relative;width:132px;height:28px;border-radius:14px;background:rgba(20,12,4,.62);border:2px solid var(--ink);margin-right:12px}
.rbar .f{position:absolute;left:2px;top:2px;bottom:2px;border-radius:11px;width:0;transition:width .35s}
.rbar .v{position:absolute;right:22px;top:2px;font:400 17px "Lilita One"}
.rbar .m{position:absolute;left:8px;top:6px;font:400 10px "Lilita One";color:rgba(255,255,255,.75)}
.rbar .i{position:absolute;right:-16px;top:-6px;font-size:30px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.4))}
.rbar.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.08)}}
.pill{display:inline-flex;align-items:center;gap:5px;background:rgba(20,12,4,.62);border:2px solid var(--ink);border-radius:12px;padding:3px 10px;font:400 15px "Lilita One";pointer-events:auto;width:max-content}
.raidp{cursor:pointer;background:rgba(120,20,10,.75)}.raidp.ok{background:rgba(20,80,20,.7)}.raidp.hot{animation:hot .6s ease-in-out infinite}@keyframes hot{50%{background:rgba(220,40,20,.9)}}
.quest{pointer-events:auto;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:7px 10px;box-shadow:0 4px 0 rgba(0,0,0,.3);max-width:210px;font-size:12.5px;line-height:1.25}
.quest .qt{font:400 13px "Lilita One";color:var(--wood);display:flex;align-items:center;gap:4px}
.quest .qr{font-size:12px;color:#6a5434;margin-top:3px}
.quest .btn{margin-top:6px;padding:6px 10px;font-size:14px;width:100%}
.quest.done{animation:glow 1s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 4px 0 rgba(0,0,0,.3),0 0 0 4px var(--gold)}}
body.selon .br,body.selon .bl{opacity:0;transform:translateY(30px)}body.selon .br *,body.selon .bl *{pointer-events:none!important}
.br,.bl{transition:.2s}
.br{right:12px;bottom:calc(env(safe-area-inset-bottom) + 14px)}
.bl{left:12px;bottom:calc(env(safe-area-inset-bottom) + 14px);display:flex;gap:10px;align-items:flex-end}
.big{pointer-events:auto;width:78px;height:78px;border-radius:22px;border:3px solid var(--ink);background:linear-gradient(#ffd866,#f0a81c);box-shadow:0 5px 0 var(--gold-d),0 8px 12px rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:34px;line-height:1}
.big small{font:400 14px "Lilita One";margin-top:3px}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 var(--gold-d)}
.big.sm{width:60px;height:60px;font-size:26px;border-radius:18px;background:linear-gradient(#e9f3ff,#a9cdee);box-shadow:0 5px 0 #6f97bd}
.big.sm small{font-size:11px}
.big.war{background:linear-gradient(#ff8a7a,#d8392b);box-shadow:0 5px 0 var(--red-d)}
.big .dot{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:var(--red);border:2px solid #fff;font:400 13px "Lilita One";color:#fff;display:none;place-items:center;padding:0 5px}
.big{position:relative}.big .dot.on{display:grid}

/* selection panel */
.sel{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 12px);transform:translate(-50%,140%);transition:transform .25s cubic-bezier(.2,1.3,.4,1);z-index:11;display:flex;flex-direction:column;align-items:center;gap:6px;width:max-content;max-width:100vw;padding:0 8px}
.sel.on{transform:translate(-50%,0)}
.sel .nm{font:400 22px "Lilita One";text-align:center}
.sel .inf{font:400 13px "Lilita One";color:#fff;background:rgba(20,12,4,.65);border-radius:10px;padding:3px 10px;text-align:center}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.act{width:70px;display:flex;flex-direction:column;align-items:center;cursor:pointer;border:0;background:none;font:inherit;padding:0}
.act .o{width:62px;height:62px;border-radius:50%;border:3px solid var(--ink);background:radial-gradient(circle at 40% 30%,#fff7df,#e8d3a1);display:grid;place-items:center;font-size:28px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.act.g .o{background:radial-gradient(circle at 40% 30%,#c9f7a8,#5fbf3a)}
.act.y .o{background:radial-gradient(circle at 40% 30%,#fff1a8,#f2b81f)}
.act.p .o{background:radial-gradient(circle at 40% 30%,#f2c9ff,#a457d6)}
.act:active .o{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.act span{font:400 12px "Lilita One";margin-top:3px;text-align:center;line-height:1.1}
.act em{font-style:normal;font:400 11px "Lilita One";background:rgba(20,12,4,.7);color:#fff;border-radius:7px;padding:1px 5px;margin-top:2px;white-space:nowrap}
.act.off{opacity:.55}

/* placement */
.plc{position:fixed;left:0;top:0;z-index:9;display:none;gap:14px;transform:translate(-50%,-100%)}
.plc.on{display:flex}
.plc button{width:54px;height:54px;border-radius:50%;border:3px solid var(--ink);font-size:24px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.plc .ok{background:radial-gradient(circle at 40% 30%,#c9f7a8,#4fae2a)}
.plc .no{background:radial-gradient(circle at 40% 30%,#ffb3a8,#d8392b)}
.plc .ok:disabled{filter:grayscale(1);opacity:.6}

/* panels */
.scrim{position:fixed;inset:0;background:rgba(10,8,4,.55);z-index:30;display:none}
.scrim.on{display:block}
.panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);opacity:0;pointer-events:none;z-index:31;width:min(94vw,520px);max-height:84dvh;background:var(--paper);border:4px solid var(--ink);border-radius:22px;box-shadow:0 8px 0 rgba(0,0,0,.35);display:flex;flex-direction:column;transition:.2s cubic-bezier(.2,1.3,.4,1)}
.panel.on{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
.ph{background:linear-gradient(#9a6a3c,#7a4f2a);border-bottom:4px solid var(--ink);border-radius:17px 17px 0 0;padding:10px 12px 10px 16px;display:flex;align-items:center;justify-content:space-between}
.ph h2{font:400 26px "Lilita One"}
.xbtn{width:40px;height:40px;border-radius:12px;border:3px solid var(--ink);background:linear-gradient(#ff8a7a,#d8392b);color:#fff;font:400 20px "Lilita One";cursor:pointer;box-shadow:0 3px 0 var(--red-d)}
.tabs{display:flex;gap:6px;padding:10px 12px 0;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:0 0 auto;border:3px solid var(--ink);border-radius:12px 12px 0 0;border-bottom:0;padding:7px 12px;background:var(--paper2);font:400 15px "Lilita One";cursor:pointer;color:var(--ink)}
.tabs button.on{background:#fff8e6}
.pb{overflow-y:auto;padding:12px;flex:1}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.card{background:#fff8e6;border:3px solid var(--ink);border-radius:16px;padding:6px 5px 8px;text-align:center;cursor:pointer;position:relative;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.card:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.card img{width:100%;aspect-ratio:1;display:block;border-radius:10px;background:radial-gradient(circle at 50% 60%,#cfeaa8,#9fcf6e)}
.card .n{font:400 13.5px "Lilita One";line-height:1.1;margin-top:4px;min-height:30px;display:flex;align-items:center;justify-content:center}
.card .k{font-size:11.5px;color:#6a5434}
.card .cst{font:400 13px "Lilita One";margin-top:3px;display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.card.lock{opacity:.6}.card.lock img{filter:grayscale(1) brightness(.8)}
.card .lk{position:absolute;inset:0;display:grid;place-items:center;font:400 13px "Lilita One";color:#fff;text-shadow:0 2px 0 #000;padding:10px;background:rgba(0,0,0,.25);border-radius:13px}
.no{color:var(--red)}
.btn{border:3px solid var(--ink);border-radius:14px;padding:10px 16px;font:400 17px "Lilita One";cursor:pointer;color:#fff;background:linear-gradient(#7fdc55,#3fa024);box-shadow:0 4px 0 var(--green-d);text-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-d)}
.btn.y{background:linear-gradient(#ffe07a,#f2a91c);box-shadow:0 4px 0 var(--gold-d);color:var(--ink);text-shadow:none}
.btn.p{background:linear-gradient(#d79bff,#9446cc);box-shadow:0 4px 0 #642a8f}
.btn.r{background:linear-gradient(#ff8a7a,#d8392b);box-shadow:0 4px 0 var(--red-d)}
.btn:disabled{filter:grayscale(1);opacity:.6}
.row{display:flex;gap:10px;align-items:center}
.li{background:#fff8e6;border:3px solid var(--ink);border-radius:16px;padding:10px;margin-bottom:9px;display:flex;gap:10px;align-items:center}
.li .ic{width:52px;height:52px;flex:0 0 52px;border-radius:12px;background:var(--paper2);display:grid;place-items:center;font-size:30px;border:2px solid rgba(0,0,0,.15)}
.li .tx{flex:1;min-width:0;font-size:13px;color:#5a4428}
.li .tx b{font:400 17px "Lilita One";color:var(--ink);display:block}
.li.lock{opacity:.5}
.stat{display:flex;justify-content:space-between;background:#fff8e6;border:2px solid rgba(0,0,0,.15);border-radius:10px;padding:7px 10px;margin-bottom:6px;font-size:14px}
.stat b{font:400 15px "Lilita One"}
.stat .up{color:var(--green-d)}
.dlg-c{text-align:center}
.dlg-c img{width:150px;height:150px;border-radius:20px;background:radial-gradient(circle at 50% 60%,#cfeaa8,#9fcf6e);border:3px solid var(--ink);margin:0 auto 10px;display:block}
.cost{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;font:400 18px "Lilita One";margin:10px 0}
.cost span{background:#fff8e6;border:2px solid rgba(0,0,0,.15);border-radius:10px;padding:3px 9px}
.trade{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.trade button{font:400 13px "Lilita One";padding:9px 4px;border:3px solid var(--ink);border-radius:12px;background:#fff8e6;cursor:pointer}
.trade button:active{transform:translateY(2px)}
h4{font:400 17px "Lilita One";margin:10px 0 7px}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 74px);transform:translate(-50%,-14px);z-index:50;background:rgba(30,20,10,.9);color:#fff;padding:9px 16px;border-radius:14px;font:400 16px "Lilita One";opacity:0;transition:.22s;pointer-events:none;max-width:92vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.fly{position:fixed;left:0;top:0;z-index:60;font-size:26px;pointer-events:none;transition:transform .7s cubic-bezier(.5,-0.3,.6,1),opacity .7s;filter:drop-shadow(0 2px 0 rgba(0,0,0,.4))}
.pop{position:fixed;z-index:60;pointer-events:none;font:400 24px "Lilita One";transform:translate(-50%,-50%);animation:up 1s ease-out forwards}
@keyframes up{to{translate:0 -60px;opacity:0}}
.banner{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.5);z-index:55;opacity:0;pointer-events:none;text-align:center;transition:.35s cubic-bezier(.2,1.6,.4,1)}
.banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.banner h1{font:400 44px "Lilita One";line-height:1}
.banner p{font:400 20px "Lilita One";margin-top:6px}
#load{position:fixed;inset:0;z-index:100;background:linear-gradient(#8fd0f0,#cfeec0);display:grid;place-items:center;transition:opacity .6s}
#load h1{font:400 64px "Lilita One"}
#load p{font:400 18px "Lilita One";text-align:center;margin-top:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>

<div class="hud tl">
  <div class="player"><div class="star ol" id="plv">1</div><div class="pinfo"><div class="pname ol">Twoja osada</div><div class="xpb"><i id="pxp"></i></div></div></div>
  <div class="pill ol" id="bld">👷 1/1</div>
  <div class="pill ol raidp" id="raidP" style="display:none"></div>
  <div class="quest" id="quest"></div>
</div>
<div class="hud tr" id="bars"></div>
<div class="hud bl">
  <div class="big sm" id="bSnd">🔊<small>Dźwięk</small></div>
  <div class="big war" id="bWar" style="display:none">⚔️<small class="ol">Wyprawy</small><span class="dot" id="dWar"></span></div>
</div>
<div class="hud br"><div class="big" id="bShop">🛒<small class="ol">Sklep</small><span class="dot" id="dShop">!</span></div></div>

<div class="sel" id="sel"><div class="nm ol" id="selN"></div><div class="inf" id="selI"></div><div class="acts" id="acts"></div></div>
<div class="plc" id="plc"><button class="no" id="plNo">✖</button><button class="ok" id="plOk">✔</button></div>

<div class="scrim" id="scrim"></div>
<div class="panel" id="panel"><div class="ph"><h2 class="ol" id="pT"></h2><button class="xbtn" id="pX">✕</button></div><div class="tabs" id="pTabs"></div><div class="pb" id="pB"></div></div>
<div class="toast" id="toast"></div>
<div class="banner" id="banner"><h1 class="ol" id="bnT"></h1><p class="ol" id="bnP"></p></div>
<div id="load"><div><h1 class="ol">Osada</h1><p class="ol">Budujemy świat…</p></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =====================================================================
   DATA
===================================================================== */
const $=s=>document.querySelector(s);
const G=24,H=G/2;
const RES={food:{n:'Żywność',e:'🌾',c:'linear-gradient(#ffe07a,#e9a91a)'},wood:{n:'Drewno',e:'🪵',c:'linear-gradient(#e0a36a,#a8672f)'},stone:{n:'Kamień',e:'🪨',c:'linear-gradient(#d7dee6,#8d99a6)'},gold:{n:'Złoto',e:'🪙',c:'linear-gradient(#fff1a0,#f2c21c)'}};
const VAL={food:1,wood:1,stone:1.5,gold:3};
const ERAS=['Epoka drewna','Epoka kamienia','Złota epoka'];
const DEF={
  hall:{n:'Ratusz',s:3,cat:'x',d:'Serce osady. Każdy poziom odblokowuje nowe budynki, wyższe poziomy i większy teren.'},
  farm:{n:'Farma',s:2,cat:'res',cost:{wood:40},t0:5,prod:"food",rate:20,max:14,cnt:[2,3,4,5,6,7,7,8],d:'Uprawia zboże. Im wyższy poziom, tym szybciej rośnie żywność.'},
  lumber:{n:'Tartak',s:2,cat:'res',cost:{food:50},t0:5,prod:'wood',rate:18,max:14,cnt:[1,1,2,2,3,3,4,4],d:'Drwale ścinają drzewa i układają drewno.'},
  quarry:{n:'Kamieniołom',s:2,cat:'res',cost:{food:120,wood:120},t0:15,prod:'stone',rate:12,max:14,cnt:[0,1,1,2,2,3,3,4],d:'Wydobywa kamień potrzebny do mocnych budowli.'},
  mine:{n:'Kopalnia złota',s:2,cat:'res',cost:{wood:400,stone:250},t0:40,prod:'gold',rate:8,max:14,cnt:[0,0,1,1,2,2,3,3],d:'Górnicy wydobywają złoto z głębi wzgórza.'},
  house:{n:'Dom',s:2,cat:'bld',cost:{wood:80,food:60},t0:8,prod:'gold',rate:3,max:12,cnt:[1,2,3,4,5,6,7,8],d:'Mieszkańcy płacą podatek w złocie i ożywiają osadę.'},
  storage:{n:'Spichlerz',s:2,cat:'bld',cost:{wood:150,food:100},t0:15,max:14,cnt:[1,1,2,2,3,3,4,4],d:'Zwiększa pojemność na żywność, drewno i kamień.'},
  vault:{n:'Skarbiec',s:2,cat:'bld',cost:{wood:600,stone:400},t0:60,max:12,cnt:[0,0,1,1,1,2,2,2],d:'Zwiększa pojemność na złoto.'},
  hut:{n:'Chata budowniczego',s:1,cat:'bld',cost:{wood:150,food:150},t0:0,max:1,cnt:[2,2,3,3,4,4,5,5],mult:4,d:'Każda chata to jeden budowniczy więcej — więcej budów naraz.'},
  market:{n:'Targ',s:2,cat:'bld',cost:{wood:500,stone:300},t0:60,max:6,cnt:[0,0,1,1,1,1,1,1],d:'Wymieniaj nadmiar surowców na te, których brakuje.'},
  barracks:{n:'Koszary',s:2,cat:'war',cost:{wood:300,food:200},t0:30,max:8,cnt:[0,1,1,1,1,1,1,1],d:'Szkolą wojowników na wyprawy. Wyższy poziom: większa armia i nowe jednostki.'},
  tower:{n:'Wieża strażnicza',s:1,cat:'war',cost:{stone:400,wood:300},t0:60,max:8,cnt:[0,0,1,2,2,3,3,4],d:'Łucznicy na wieży bronią osady: +5 obrony na poziom wieży.'},
  wall:{n:'Palisada',s:1,cat:'war',cost:{wood:25},t0:0,max:1,cnt:[0,10,15,20,25,30,35,40],d:'Każdy odcinek dodaje obronę przed najazdami (drewno +1, kamień +2, złota epoka +3).'},
  flowers:{n:'Rabata kwiatów',s:1,cat:'dec',cost:{wood:30},charm:1,d:'+1% do całej produkcji.'},

  const ids=new Set();

    if(!r){const root=new THREE.Group();root.userData.ref={k:'b',id:b.id};scene.add(root);picks.push(root);r=recs[b.id]={root,key:''}}
    if(r.key!==key){const wasBuilt=r.key&&r.l!==b.l;r.key=key;r.l=b.l;
      while(r.root.children.length)r.root.remove(r.root.children[0]);

  const oids=new Set();
  for(const o of S.obs){oids.add(o.id);if(!orec[o.id]){const root=new THREE.Group();mergeStatic([makeMesh(o.t,1,true)],root);root.userData.ref={k:'o',id:o.id};root.position.copy(oPos(o));root.rotation.y=(o.id*1.7)%6;scene.add(root);picks.push(root);orec[o.id]={root}}}
  for(const k in orec)if(!oids.has(+k)){scene.remove(orec[k].root);picks.splice(picks.indexOf(orec[k].root),1);delete orec[k];removeLab('o'+k)}

let OCC=null;
function occGrid(ignore){const o=Array.from({length:G},()=>new Int32Array(G));

function bfs(si,sj,ti,tj){if(OCC[ti][tj]||!unl(ti,tj))return null;const N=G*G,prev=new Int16Array(N).fill(-1),s=si*G+sj,t=ti*G+tj;prev[s]=s;const q=[s];let h=0;

  if(prev[t]===-1)return null;const p=[];let c=t;while(c!==s){p.push(c);c=prev[c]}return p.reverse()}

/* ---------- raids (najazdy barbarzyńców) ---------- */
let RA=null;
function scheduleRaid(sec){S.nextRaid=Date.now()+sec*1000;S.warned=0;dirty=true}
function rollRaid(){const str=Math.max(2,Math.round(raidStr()*(.88+Math.random()*.24))),def=defense(),win=def>=str;
  const frac=win?Math.min(.45,.3*str/Math.max(1,def)):.5,unitLoss={},loss={};
  for(const u in S.army)unitLoss[u]=Math.round(S.army[u]*frac);
  if(!win)for(const r in RES)loss[r]=Math.floor(S.res[r]*.12);
  return{str,def,win,unitLoss,loss,loot:win?{food:str*18,gold:str*6}:{},gems:win&&S.raidN%3===2?2:0}}
function applyRaid(R){const txt=[];
  for(const u in R.unitLoss)S.army[u]=Math.max(0,(S.army[u]||0)-R.unitLoss[u]);
  if(R.win){for(const r in R.loot){const g=gain(r,R.loot[r]);if(g)txt.push(`${RES[r].e} +${fmt(g)}`)}if(R.gems){S.gems+=R.gems;txt.push(`💎 +${R.gems}`)}S.st.raidWin=(S.st.raidWin||0)+1;addXP(5+R.str)}
  else{for(const r in R.loss){const v=Math.min(S.res[r],R.loss[r]);S.res[r]-=v;if(v)txt.push(`${RES[r].e} −${fmt(v)}`)}S.st.raidLose=(S.st.raidLose||0)+1}
  S.raidN++;S.raidK=R.win?raidK()+1:Math.max(0,raidK()-2);S.raidH=hallL();S.raidP=null;scheduleRaid(300+Math.random()*300);dirty=true;
  const lost=Object.entries(R.unitLoss).filter(x=>x[1]).map(([u,n])=>`${UNITS[u].e} −${n}`);
  return{txt,lost}}
function raidReport(R,res){return `<div class="dlg-c"><div style="font-size:64px">${R.win?'🏆':'🔥'}</div><h4>${R.win?'Wioska obroniona!':'Barbarzyńcy splądrowali wioskę'}</h4>
  <div class="stat"><span>Siła najeźdźców</span><b>${R.str}</b></div><div class="stat"><span>Twoja obrona</span><b>${R.def}</b></div>
  ${res.txt.length?`<div class="cost">${res.txt.map(t=>`<span>${t}</span>`).join('')}</div>`:''}${res.lost.length?`<p>Polegli: ${res.lost.join(' ')}</p>`:''}
  ${R.win?'':'<p>Wyszkol więcej obrońców w Koszarach, stawiaj Palisady i Wieże.</p>'}</div>`}
function raidTick(){

function raidFrame(dt,T){if(!RA)return;const t=(performance.now()-RA.t0)/1000,W=3.2,F=3.2,end=RA.R.win?W+F+.6:W+F+2.4;

/* ---------- jobs ---------- */
function checkJobs(silent){const now=Date.now();let any=0;
  for(const b of S.b)if(b.job&&now>=b.job.end){const k=b.job.kind,dur=(b.job.end-b.job.start)/1000;delete b.job;any++;
    if(k==='build'){b.l=1;b.t0=now}else b.l++;addXP(4+Math.round(Math.sqrt(dur)*1.5));
    if(!silent){sync();const rec=recs[b.id];burst(bPos(b));sfx('build');
      if(b.t==='hall'){const e=era();banner(`${hallName(b.l)} poz. ${b.l}!`,b.l===3||b.l===6?ERAS[e]+'!':'Nowe budynki i teren');S.gems+=3}
      else toast(`${DEF[b.t].n} ${k==='build'?'zbudowano':'— poziom '+b.l}! ✨`)}}
  for(const o of [...S.obs])if(o.job&&now>=o.job.end){const d=OBS[o.t],am=Math.round((30+Math.random()*50)*(1+hallL()*.5));S.obs=S.obs.filter(q=>q!==o);any++;
    S.st.clear=(S.st.clear||0)+1;gain(d.r,am);let gm=Math.random()<.25?1+((Math.random()*3)|0):0;S.gems+=gm;addXP(3);
    if(!silent){const p=oPos(o);burst(p);sfx('coin');const sc=toScreen(p.clone().setY(1));popTxt(`+${am} ${RES[d.r].e}${gm?` +${gm}💎`:''}`,sc.x,sc.y)}}
  while(S.train.length&&now>=S.train[0].end){const u=S.train.shift().u;S.army[u]++;S.st.trained=(S.st.trained||0)+1;any++}
  if(S.exp&&now>=S.exp.end){const x=S.exp;S.exp=null;for(const u in x.ret)S.army[u]+=x.ret[u];any++;
    if(x.win){let txt=[];for(const r in x.loot){const g=gain(r,x.loot[r]);if(g)txt.push(`${RES[r].e} ${fmt(g)}`)}if(x.gems){S.gems+=x.gems;txt.push(`💎 ${x.gems}`)}S.camps[x.c]++;addXP(10+x.c*8);
      if(!silent){banner('Zwycięstwo!',`${CAMPS[x.c][0]} pokonany`);dialog('Wyprawa wróciła ⚔️',`<div class="dlg-c"><div style="font-size:64px">${CAMPS[x.c][1]}</div><h4>${CAMPS[x.c][0]} — zwycięstwo!</h4><div class="cost">${txt.map(t=>`<span>${t}</span>`).join('')}</div></div>`)}}
    else if(!silent)dialog('Wyprawa wróciła 💀',`<div class="dlg-c"><div style="font-size:64px">${CAMPS[x.c][1]}</div><h4>Porażka — przeciwnik był za silny</h4><p>Wyszkol więcej wojowników lub ulepsz Koszary i Wieże.</p></div>`);
    sfx(x.win?'build':'err')}
  if(any){dirty=true;sync();if(SEL)drawSel()}return any}

function startPlace(t,id){deselect();closePanel();
  if(!id){if(cntAll(t)>=allowed(t)){toast('Limit osiągnięty — ulepsz '+hallName(hallL()));sfx('err');return}
    if(!canPay(newCost(t))){toast('Brakuje surowców');sfx('err');return}
    if(DEF[t].t0&&freeB()<1){toast('👷 Wszyscy budowniczowie są zajęci');sfx('err');return}}
  const s=DEF[t].s,b=id&&S.b.find(q=>q.id===id);
  const g=makeMesh(t,b?b.l:1);scene.add(g);
  const foot=new THREE.Mesh(new THREE.PlaneGeometry(s,s),new THREE.MeshBasicMaterial({color:0x66ff66,transparent:true,opacity:.45,depthWrite:false}));foot.rotation.x=-Math.PI/2;scene.add(foot);
  const grid=new THREE.GridHelper(side(),side(),0xffffff,0xffffff);grid.material.transparent=true;grid.material.opacity=.22;grid.position.y=.03;if(side()%2)grid.position.x=grid.position.z=0;scene.add(grid);
  PL={t,id,g,foot,grid,i:0,j:0};
  if(b){PL.i=b.i;PL.j=b.j}else{const sp=findSpot(t);PL.i=sp[0];PL.j=sp[1]}
  sync();posGhost();$('#plc').classList.add('on');sfx('tap')}
function findSpot(t){const c=[Math.round(cam.t.x+H-DEF[t].s/2),Math.round(cam.t.z+H-DEF[t].s/2)];
  for(let r=0;r<G;r++)for(let i=c[0]-r;i<=c[0]+r;i++)for(let j=c[1]-r;j<=c[1]+r;j++)if(canPlace(t,i,j))return[i,j];return c}
function moveGhost(p){const s=DEF[PL.t].s;const i=Math.round(p.x+H-s/2),j=Math.round(p.z+H-s/2);if(i!==PL.i||j!==PL.j){PL.i=clamp(i,0,G-s);PL.j=clamp(j,0,G-s);posGhost();sfx('tick')}}
function posGhost(){const s=DEF[PL.t].s,x=PL.i-H+s/2,z=PL.j-H+s/2,ok=canPlace(PL.t,PL.i,PL.j,PL.id);
  PL.g.position.set(x,.15,z);PL.foot.position.set(x,.04,z);PL.foot.material.color.set(ok?0x66ff66:0xff4444);PL.ok=ok;$('#plOk').disabled=!ok}
function endPlace(){if(!PL)return;scene.remove(PL.g,PL.foot,PL.grid);PL=null;$('#plc').classList.remove('on');sync()}
$('#plNo').onclick=()=>{endPlace();sfx('tap')};
$('#plOk').onclick=()=>{if(!PL||!PL.ok)return;const{t,id,i,j}=PL;
  if(id){const b=S.b.find(q=>q.id===id);b.i=i;b.j=j;endPlace();recs[id].pop=performance.now();sfx('place');dirty=true;return}
  const c=newCost(t);if(!canPay(c)){toast('Brakuje surowców');return endPlace()}
  pay(c);const d=DEF[t],b={id:S.nid++,t,i,j,l:d.t0?0:1,t0:Date.now()};if(d.t0)b.job={kind:'build',start:Date.now(),end:Date.now()+d.t0*1000};
  S.b.push(b);endPlace();burst(bPos(b));sfx('place');if(!d.t0)setTimeout(()=>sfx('coin'),120);addXP(2);dirty=true;
  if(!d.t0)recs[b.id].pop=performance.now();
  if((t==='wall'||d.cat==='dec')&&cntAll(t)<allowed(t)&&canPay(newCost(t))){startPlace(t);const sp=findSpotNear(t,i,j);if(sp){PL.i=sp[0];PL.j=sp[1];posGhost()}}};
function findSpotNear(t,i,j){for(const[a,b]of[[1,0],[0,1],[-1,0],[0,-1],[1,1],[-1,-1]])if(canPlace(t,i+a,j+b))return[i+a,j+b];return null}

  for(const k in RES){const el=$('#r-'+k),cp=capOf(k);shown[k]=shown[k]==null?S.res[k]:shown[k]+(S.res[k]-shown[k])*.25;if(Math.abs(shown[k]-S.res[k])<1)shown[k]=S.res[k];
    el.querySelector('.v').textContent=fmt(shown[k]);el.querySelector('.f').style.width=`calc(${Math.min(1,S.res[k]/cp)*100}% - 4px)`;el.querySelector('.m').textContent='max '+fmt(cp)}
  $('#r-gems .v').textContent=fmt(S.gems);
  $('#plv').textContent=S.lvl;$('#pxp').style.width=S.xp/xpNeed(S.lvl)*100+'%';
  $('#bld').textContent=`👷 ${freeB()}/${builders()} wolnych`;
  const rp=$('#raidP');if(raidsOn()&&S.nextRaid&&!RA){const left=(S.nextRaid-Date.now())/1000,st=raidStr(),df=defense();rp.style.display='';rp.className='pill ol raidp'+(df>=st?' ok':'')+(left<45?' hot':'');rp.textContent=`⚔️ Najazd ${ft(left)} · 👹${st} vs 🛡️${df}`}else rp.style.display='none';
  $('#bWar').style.display=cnt('barracks')?'':'none';
  $('#dWar').textContent='!';$('#dWar').classList.toggle('on',!S.exp&&power()>0&&S.camps.some((c,i)=>c===0&&power()>=CAMPS[i][2]));
  const canBuild=freeB()>0&&Object.keys(DEF).some(t=>DEF[t].cat!=='x'&&DEF[t].cat!=='dec'&&cntAll(t)<allowed(t)&&canPay(newCost(t)));
  $('#dShop').classList.toggle('on',canBuild);
  const q=QUESTS[S.q],qe=$('#quest');
  if(!q){qe.style.display='none'}else{const ok=q[1]();const key=S.q+'|'+ok;if(qe.dataset.k!==key){qe.dataset.k=key;
    qe.className='quest'+(ok?' done':'');qe.innerHTML=`<div class="qt">📜 Zadanie ${S.q+1}/${QUESTS.length}</div>${q[0]}<div class="qr">Nagroda: ${costTxt(q[2])}</div>${ok?'<button class="btn y">Odbierz</button>':''}`;
    const b=qe.querySelector('button');if(b)b.onclick=()=>{for(const[r,v]of Object.entries(q[2]))gain(r,v);addXP(8);S.q++;sfx('build');const rc=qe.getBoundingClientRect();Object.keys(q[2]).forEach(r=>r!=='gems'&&flyRes(r,rc.left+rc.width/2,rc.top+rc.height/2,q[2][r]));dirty=true;hud()}}}
}
function toScreen(v){const p=v.clone().project(camera);return{x:(p.x+1)/2*innerWidth,y:(1-p.y)/2*innerHeight,vis:p.z<1}}
function flyRes(r,x,y,n){const tg=$('#r-'+r).getBoundingClientRect(),tx=tg.right-4,ty=tg.top+tg.height/2;popTxt('+'+fmt(n),x,y-30);
  for(let i=0;i<Math.min(7,2+n/20);i++){const f=document.createElement('div');f.className='fly';f.textContent=RES[r].e;const ox=(Math.random()-.5)*50,oy=(Math.random()-.5)*30;
    f.style.transform=`translate(${x+ox-13}px,${y+oy-13}px)`;document.body.appendChild(f);
    setTimeout(()=>{f.style.transform=`translate(${tx-13}px,${ty-13}px) scale(.7)`},30+i*55);
    setTimeout(()=>{f.remove();const b=$('#r-'+r);b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump')},760+i*55)}}
function popTxt(t,x,y){const p=document.createElement('div');p.className='pop ol';p.textContent=t;p.style.left=x+'px';p.style.top=y+'px';document.body.appendChild(p);setTimeout(()=>p.remove(),1000)}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2000)}
let bt;function banner(a,b){$('#bnT').textContent=a;$('#bnP').textContent=b||'';$('#banner').classList.add('on');clearTimeout(bt);bt=setTimeout(()=>$('#banner').classList.remove('on'),1900)}
$('#raidP').onclick=()=>{audioInit();if(cnt('barracks'))openTrain();else toast('Zbuduj Koszary, by szkolić obrońców')};
$('#bShop').onclick=()=>{audioInit();deselect();openShop()};
$('#bWar').onclick=()=>{audioInit();openExp()};
$('#bSnd').onclick=()=>{S.snd=S.snd?0:1;$('#bSnd').innerHTML=(S.snd?'🔊':'🔇')+'<small>Dźwięk</small>';audioInit();sfx('tap');dirty=true};
$('#bSnd').innerHTML=(S.snd?'🔊':'🔇')+'<small>Dźwięk</small>';

/* labels over buildings */
const labs={};
function removeLab(k){if(labs[k]){labs[k].el.remove();delete labs[k]}}
function lab(k){if(!labs[k]){const el=document.createElement('div');el.className='lab';$('#labels').appendChild(el);labs[k]={el,html:''};
  el.addEventListener('pointerdown',e=>{const bb=e.target.closest('.bub');if(!bb)return;e.stopPropagation();const b=S.b.find(q=>q.id==bb.dataset.id);if(b)collect(b,e.clientX,e.clientY)})}return labs[k]}
const LH={hall:3.6,farm:1.0,lumber:1.4,quarry:1.3,mine:1.5,house:1.7,storage:2.1,vault:1.8,hut:1.0,barracks:1.9,tower:2.8,market:1.2,flowers:.7,oak:1.3,banner:1.6,statue:1.3,fountain:1.4};
function labels(){const now=Date.now();
  for(const b of S.b){const k='b'+b.id;let html='';
    if(PL&&PL.id===b.id){}
    else if(b.job){const p=(now-b.job.start)/(b.job.end-b.job.start);html=`<div class="tmr">🔨 ${ft((b.job.end-now)/1000)}<i><b style="width:${Math.min(100,p*100)}%"></b></i></div>`}
    else if(DEF[b.t].prod&&b.l>=1){const st=stored(b);if(st>=bubT(b))html=`<div class="bub ${st>=intCap(b)?'full':''}" data-id="${b.id}"><span>${RES[DEF[b.t].prod].e}</span></div>`}
    else if(b.t==='barracks'&&S.train.length)html=`<div class="chip">🗡️ ${S.train.length} · ${ft((S.train[0].end-now)/1000)}</div>`;
    if(!html){if(labs[k]){labs[k].el.style.display='none';labs[k].html=''}continue}
    const L=lab(k);if(L.html!==html){L.html=html;L.el.innerHTML=html}
    const s=toScreen(bPos(b).setY(LH[b.t]||1.5));L.el.style.display=s.vis?'':'none';L.el.style.transform=`translate(${s.x}px,${s.y}px) translate(-50%,-100%)`}
  for(const o of S.obs){const k='o'+o.id;if(!o.job){if(labs[k])removeLab(k);continue}const L=lab(k),html=`<div class="tmr">🪓 ${ft((o.job.end-now)/1000)}</div>`;if(L.html!==html){L.html=html;L.el.innerHTML=html}
    const s=toScreen(oPos(o).setY(1.3));L.el.style.transform=`translate(${s.x}px,${s.y}px) translate(-50%,-100%)`}
  if(PL){const s=toScreen(PL.g.position.clone().setY(DEF[PL.t].s*.7+1.1));$('#plc').style.transform=`translate(${s.x}px,${s.y}px) translate(-50%,-100%)`}}

/* audio */
let AC=null;function audioInit(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
let NB=null;function noise(dur,vol,f0,f1,type='bandpass',at=0){if(!AC)return;const t=AC.currentTime+at;if(!NB){NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  const src=AC.createBufferSource();src.buffer=NB;const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(f1,t+dur);fl.Q.value=1.2;
  const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);src.connect(fl).connect(g).connect(AC.destination);src.start(t);src.stop(t+dur+.02)}
function tone(seq,vol=.12,at=0){if(!AC)return;const t=AC.currentTime+at;let o=0;for(const[f,d,ty,f2]of seq){const os=AC.createOscillator(),g=AC.createGain();os.type=ty||'triangle';os.frequency.setValueAtTime(f,t+o);if(f2)os.frequency.exponentialRampToValueAtTime(f2,t+o+d);
  g.gain.setValueAtTime(.0001,t+o);g.gain.exponentialRampToValueAtTime(vol,t+o+.012);g.gain.exponentialRampToValueAtTime(.0001,t+o+d);os.connect(g).connect(AC.destination);os.start(t+o);os.stop(t+o+d+.03);o+=d*.85}}
function sfx(k){if(!S.snd||!AC)return;
  switch(k){
  case'tap':tone([[620,.05]],.08);break;
  case'tick':tone([[1300,.02,'square']],.025);break;
  case'coin':tone([[1046,.06,'square'],[1568,.14,'square']],.07);break;
  case'build':tone([[523,.09],[659,.09],[784,.09],[1047,.3]]);noise(.25,.15,800,200,'lowpass');break;
  case'up':tone([[392,.1],[523,.1],[659,.1],[784,.25]]);break;
  case'err':tone([[180,.18,'sawtooth',120]],.07);break;
  case'place':noise(.18,.35,400,80,'lowpass');tone([[140,.12,'sine',70]],.15);break;
  case'chop':for(let i=0;i<3;i++)noise(.07,.3,2500,900,'bandpass',i*.16);break;
  case'train':tone([[330,.07,'square'],[440,.09,'square']],.05);break;
  case'clash':noise(.12,.25,5000+Math.random()*2000,1800,'highpass');tone([[1800+Math.random()*900,.09,'square',900]],.03);break;
  case'horn':tone([[220,.5,'sawtooth',233],[220,.25,'sawtooth'],[294,.7,'sawtooth',280]],.06);break;
  case'win':tone([[523,.12],[659,.12],[784,.12],[1047,.18],[784,.1],[1047,.45]],.13);break;
  case'lose':tone([[392,.25,'sawtooth'],[349,.25,'sawtooth'],[311,.25,'sawtooth'],[262,.6,'sawtooth']],.06);break;
  case'chest':tone([[784,.08],[988,.08],[1175,.08],[1568,.35]],.1);noise(.4,.08,6000,3000,'highpass');break;
  case'bird':{const b=2400+Math.random()*1200;tone([[b,.07,'sine',b*1.4],[b*1.1,.06,'sine',b*.8],[b,.09,'sine',b*1.5]],.025);break}
  }}

/* =====================================================================
   LOOP
===================================================================== */
const clock=new THREE.Clock();let acc=0,smokeT=0;
function frame(){requestAnimationFrame(frame);const dt=Math.min(.05,clock.getDelta()),T=clock.elapsedTime,now=performance.now();
  if(intro){const k=Math.min(1,(now-intro.t0)/2600),e=1-Math.pow(1-k,3);cam.d=intro.d0+(26-intro.d0)*e;cam.yaw=intro.y0+(Math.PI/4-intro.y0)*e;if(k>=1)intro=null}
  updCam();
  // water
  const wp=water.geometry.attributes.position,base=water.userData.base;for(let i=0;i<wp.count;i++){const x=base[i*3],z=base[i*3+2];wp.array[i*3+1]=Math.sin(x*.35+T*1.2)*.07+Math.cos(z*.3+T*.9)*.07}wp.needsUpdate=true;
  if(((T*20)|0)%3===0)water.geometry.computeVertexNormals();
  clouds.forEach((c,i)=>{c.position.x+=dt*(.5+i*.05);if(c.position.x>45)c.position.x=-45});
  // building anims
  for(const k in recs){const r=recs[k],b=S.b.find(q=>q.id==k);if(!b)continue;const u=r.core.userData;
    (u.flags||[]).forEach(f=>{const p=f.geometry.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i)+.25;p.setZ(i,Math.sin(x*9-T*6)*.05*x*2)}p.needsUpdate=true});
    (u.spin||[]).forEach(([m,ax,sp])=>m.rotation[ax]+=dt*sp);
    if(b.job&&b.job.kind==='build'){const p=clamp((Date.now()-b.job.start)/(b.job.end-b.job.start),0,1);r.core.scale.set(1,.12+.88*p,1)}else r.core.scale.y=1;
    if(r.pop){const k2=(now-r.pop)/450;if(k2>=1){r.pop=0;r.core.scale.x=r.core.scale.z=1;if(!b.job)r.core.scale.y=1}else{const s=1+Math.sin(k2*Math.PI)*.18*(1-k2);r.core.scale.x=r.core.scale.z=s;if(!b.job)r.core.scale.y=2-s}}}
  for(const k in orec){const r=orec[k];if(r.pop){const k2=(now-r.pop)/450;r.root.scale.setScalar(k2>=1?1:1+Math.sin(k2*Math.PI)*.15);if(k2>=1)r.pop=0}const o=S.obs.find(q=>q.id==k);if(o&&o.job)r.root.rotation.z=Math.sin(T*18)*.04;else r.root.rotation.z=0}
  // smoke & spray
  smokeT+=dt;if(smokeT>.45){smokeT=0;for(const k in recs){const r=recs[k],u=r.core.userData,b=S.b.find(q=>q.id==k);if(!b||b.l<1)continue;
      (u.smoke||[]).forEach(p=>{if(Math.random()<.6)particle(r.root.localToWorld(p.clone()),'#d9d9d9',{v:new V3(.15,.55,.05),grow:1.2,life:2.6,op:.55})});
      if(u.spray)for(let i=0;i<3;i++)particle(r.root.localToWorld(u.spray.clone()),'#8fd6ff',{v:new V3((Math.random()-.5)*.8,1.4,(Math.random()-.5)*.8),g:-4,life:.7,op:.8});
      if(b.job&&Math.random()<.7)particle(r.root.position.clone().add(new V3((Math.random()-.5)*DEF[b.t].s,.1,(Math.random()-.5)*DEF[b.t].s)),'#e2d3b5',{v:new V3(0,.5,0),grow:1,life:1.2,op:.6})}}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;if(p.t>=p.life){scene.remove(p.m);p.m.material.dispose();parts.splice(i,1);continue}
    p.v.y+=p.g*dt;p.m.position.addScaledVector(p.v,dt);if(p.grow)p.m.scale.setScalar(1+p.t*p.grow);if(p.spin){p.m.rotation.x+=dt*8;p.m.rotation.y+=dt*6}p.m.material.opacity=(1-p.t/p.life)*(p.op||.85)}
  // people
  const jobs=[...S.b.filter(b=>b.job).map(b=>{const s=DEF[b.t].s;return bPos(b).add(new V3(s/2+.15,0,s/2+.15))}),...S.obs.filter(o=>o.job).map(o=>oPos(o).add(new V3(.45,0,.35)))];
  const huts=S.b.filter(b=>b.t==='hut'&&b.l>=1);
  people.builders.forEach((f,k)=>{const tgt=jobs[k]||(huts[k%Math.max(1,huts.length)]?bPos(huts[k%huts.length]).add(new V3(.45,0,.4+k*.05)):f.position);
    const d=tgt.clone().sub(f.position);d.y=0;const L=d.length();
    if(L>.05){const st=Math.min(L,dt*2.6);f.position.addScaledVector(d.normalize(),st);f.rotation.y=Math.atan2(d.x,d.z);f.position.y=Math.abs(Math.sin(T*12))*.05}
    else{f.position.y=0;if(jobs[k]){const c=(S.b.find(b=>b.job&&bPos(b).distanceTo(tgt)<3)||{});f.rotation.y=Math.atan2(-1,-1)}}
    if(f.userData.hammer)f.userData.hammer.rotation.x=jobs[k]&&L<.05?Math.sin(T*10)*.9:0});
  people.villagers.forEach(v=>{const f=v.f;
    if(!v.path.length){v.wait-=dt;f.position.y=0;if(v.wait<=0){const si=clamp(Math.round(f.position.x+H-.5),0,G-1),sj=clamp(Math.round(f.position.z+H-.5),0,G-1);
        for(let t=0;t<8;t++){const ti=(si+(Math.random()*14-7))|0,tj=(sj+(Math.random()*14-7))|0;if(ti<0||tj<0||ti>=G||tj>=G)continue;const p=bfs(si,sj,ti,tj);if(p&&p.length){v.path=p;break}}v.wait=1+Math.random()*4}return}
    const c=v.path[0],tx=(c/G|0)-H+.5,tz=c%G-H+.5,dx=tx-f.position.x,dz=tz-f.position.z,L=Math.hypot(dx,dz);
    if(L<.04){v.path.shift();return}const st=Math.min(L,dt*1.1);f.position.x+=dx/L*st;f.position.z+=dz/L*st;f.rotation.y=Math.atan2(dx,dz);f.position.y=Math.abs(Math.sin(T*10))*.04});
  if(!RA)people.soldiers.forEach((f,k)=>{f.position.y=Math.abs(Math.sin(T*3+k))*.02});
  raidFrame(dt,T);
  // fill visuals + jobs + hud (throttled)
  acc+=dt;if(acc>.4){acc=0;checkJobs();raidTick();
    for(const k in recs){const r=recs[k],u=r.core.userData,b=S.b.find(q=>q.id==k);if(!u.fill||!b)continue;const f=b.l<1?0:stored(b)/intCap(b);
      if(u.fillMode==='scale')u.fill.forEach(m=>m.scale.set(1,.15+.85*f,1));else u.fill.forEach((m,i)=>m.visible=i<Math.ceil(f*u.fill.length))}
    if(Math.random()<.025)sfx('bird');hud();if(SEL)drawSel();if(PANEL&&['train','exp'].includes(PANEL.kind))PANEL.render();tickTimers();
    if(dirty){dirty=false;save()}}
  if(SEL){const r=SEL.k==='b'?recs[SEL.id]:orec[SEL.id];if(r){selRing.visible=true;selRing.position.set(r.root.position.x,.05,r.root.position.z);const s=SEL.k==='b'?DEF[(S.b.find(q=>q.id===SEL.id)||{t:'hut'}).t].s:1;selRing.scale.setScalar(s*.75*(1+Math.sin(T*5)*.04))}}else selRing.visible=false;
  if(PL)PL.g.position.y=.15+Math.sin(T*5)*.06;
  labels();
  renderer.render(scene,camera)}
const selRing=new THREE.Mesh(new THREE.RingGeometry(.62,.72,40),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.85,depthWrite:false}));selRing.rotation.x=-Math.PI/2;scene.add(selRing);

/* boot */
const awayFrom=S.last||Date.now(),notes=[];
const doneAway=S.b.filter(b=>b.job&&b.job.end<=Date.now()).length;
if(doneAway)notes.push(`🔨 Ukończone budowy: <b>${doneAway}</b>`);
if(S.exp&&S.exp.end<=Date.now())notes.push(`⚔️ Wyprawa wróciła: ${CAMPS[S.exp.c][0]} — ${S.exp.win?'zwycięstwo!':'porażka'}`);
checkJobs(true);
if(raidsOn()){let R=null;if(S.raidP)R=S.raidP;else if(S.nextRaid&&Date.now()>S.nextRaid)R=rollRaid();
  if(R){const res=applyRaid(R);notes.push(`${R.win?'🏆 Odparto najazd':'🔥 Najazd splądrował wioskę'} (wróg ${R.str} · 🛡️ ${R.def}) ${res.txt.join(' ')}`)}}
sync();updCam();hud();frame();
setTimeout(()=>{$('#load').style.opacity=0;setTimeout(()=>$('#load').remove(),700)},300);
const away=(Date.now()-awayFrom)/60000,today=new Date().toDateString();
let chest=0;if(!S.daily)S.daily={d:today,streak:0};else if(S.daily.d!==today){const y=new Date(Date.now()-864e5).toDateString();S.daily.streak=S.daily.d===y?Math.min(7,S.daily.streak+1):1;S.daily.d=today;chest=S.daily.streak;dirty=true}
function chestDialog(){const k=chest,h=hallL(),r={food:80*k*h,wood:80*k*h};if(h>=3)r.gold=30*k*h;if(k>=3)r.gems=k>=7?10:2;
  dialog('Codzienna skrzynia',`<div class="dlg-c"><div style="font-size:70px">🎁</div><h4>Dzień ${k} z rzędu!</h4><div class="row" style="justify-content:center;gap:5px;margin:8px 0">${[1,2,3,4,5,6,7].map(d=>`<span style="width:34px;height:34px;border-radius:9px;display:grid;place-items:center;border:2px solid var(--ink);background:${d<=k?'#ffd866':'#eadfc4'};font:400 15px Lilita One">${d}</span>`).join('')}</div><div class="cost">${costHTML(r).replace(/class="no"/g,'')}</div><p style="font-size:13px">Wracaj codziennie — 7. dzień z rzędu daje 10 💎!</p></div>`,
  [['Odbierz',()=>{for(const[x,v]of Object.entries(r))gain(x,v);sfx('chest');closePanel();toast('🎁 Nagroda odebrana!')},'y']])}
if(away>2||notes.length)setTimeout(()=>dialog('Witaj z powrotem!',`<div class="dlg-c"><div style="font-size:64px">🌅</div><p>Nie było cię ${away>90?Math.round(away/60)+' godz':Math.round(away)+' min'}.</p>${notes.map(n=>`<div class="stat" style="display:block;text-align:left">${n}</div>`).join('')}<p>Surowce czekają w dymkach nad budynkami — dotknij, by zebrać!</p></div>`,[[chest?'Dalej':'Do dzieła!',()=>{closePanel();if(chest)setTimeout(chestDialog,250)},'y']]),900);
else if(chest)setTimeout(chestDialog,900);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
setInterval(save,5000);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
